<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs></defs><rect x="0" y="0" width="1200" height="330" rx="22" fill="#0f172a"/><text x="600" y="58" font-size="26" fill="#f8fafc" font-weight="700" text-anchor="middle" >Ogni affermazione è una di queste tre cose</text><rect x="30" y="92" width="360" height="200" rx="18" fill="#1e293b" stroke="#14b8a6" stroke-width="3"/><circle cx="84" cy="150" r="30" fill="#14b8a6"/><g transform="translate(84,150)" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"><path d="M-16,0 C-8,-12 8,-12 16,0 C8,12 -8,12 -16,0 Z"/><circle r="4" fill="#0f172a"/></g><text x="134" y="142" font-size="32" fill="#f8fafc" font-weight="800" text-anchor="start" >Esaminato</text><text x="134" y="170" font-size="18" fill="#14b8a6" font-weight="600" text-anchor="start" >letto e analizzato</text><text x="58" y="214" font-size="19" fill="#e2e8f0" font-weight="400" text-anchor="start" >Codice, configurazione e documenti</text><text x="58" y="242" font-size="19" fill="#e2e8f0" font-weight="400" text-anchor="start" >letti: il report dice quali.</text><rect x="420" y="92" width="360" height="200" rx="18" fill="#1e293b" stroke="#22c55e" stroke-width="3"/><circle cx="474" cy="150" r="30" fill="#22c55e"/><g transform="translate(474,150)"><path d="M-14,1 L-4,11 L15,-10" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="524" y="142" font-size="32" fill="#f8fafc" font-weight="800" text-anchor="start" >Provato</text><text x="524" y="170" font-size="18" fill="#22c55e" font-weight="600" text-anchor="start" >test eseguito, con esito</text><text x="448" y="214" font-size="19" fill="#e2e8f0" font-weight="400" text-anchor="start" >Prova minima redatta e passi per</text><text x="448" y="242" font-size="19" fill="#e2e8f0" font-weight="400" text-anchor="start" >ripeterla. Mai un test solo scritto.</text><rect x="810" y="92" width="360" height="200" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/><circle cx="864" cy="150" r="30" fill="#f59e0b"/><text x="864" y="162" font-size="38" font-weight="800" fill="#0f172a" text-anchor="middle">?</text><text x="914" y="142" font-size="32" fill="#f8fafc" font-weight="800" text-anchor="start" >Ignoto</text><text x="914" y="170" font-size="18" fill="#f59e0b" font-weight="600" text-anchor="start" >non verificato, con motivo</text><text x="838" y="214" font-size="19" fill="#e2e8f0" font-weight="400" text-anchor="start" >Ciò che manca resta scritto: non</text><text x="838" y="242" font-size="19" fill="#e2e8f0" font-weight="400" text-anchor="start" >diventa mai un «tutto a posto».</text></svg>
