<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs></defs><rect x="0" y="0" width="1100" height="470" rx="22" fill="#0f172a"/><rect x="0" y="0" width="1100" height="70" rx="22" fill="#1e293b"/><rect x="0" y="40" width="1100" height="30" rx="0" fill="#1e293b"/><text x="32" y="44" font-size="22" fill="#5eead4" font-weight="800" text-anchor="start" >APP-002</text><text x="142" y="44" font-size="22" fill="#f8fafc" font-weight="700" text-anchor="start" >Endpoint di seed demo senza autenticazione crea utenti</text><rect x="32" y="92" width="213" height="30" rx="15" fill="#14b8a6"/><text x="138.5" y="112.6" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" >confermato da codice</text><rect x="255" y="92" width="148" height="30" rx="15" fill="#ef4444"/><text x="329.0" y="112.6" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle" >severità alta</text><rect x="413" y="92" width="185" height="30" rx="15" fill="#334155"/><text x="505.5" y="112.6" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle" >CWE-306 · CWE-798</text><rect x="608" y="92" width="176" height="30" rx="15" fill="#334155"/><text x="696.0" y="112.6" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle" >confidenza media</text><text x="32" y="162" font-size="13" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1.5">PROVA MINIMA</text><text x="250" y="162" font-size="16" fill="#e2e8f0" font-weight="400" text-anchor="start" >Il middleware elenca la route tra i percorsi pubblici; il gestore POST non controlla sessione, ruolo né ambiente.</text><text x="32" y="206" font-size="13" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1.5">COSA FA</text><text x="250" y="206" font-size="16" fill="#e2e8f0" font-weight="400" text-anchor="start" >Password fissa nel codice, utenti con email prevedibili nelle organizzazioni reali.</text><text x="32" y="250" font-size="13" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1.5">IMPATTO REALE</text><text x="250" y="250" font-size="16" fill="#e2e8f0" font-weight="400" text-anchor="start" >Non dimostrato: nessun test dinamico era autorizzato. Valori redatti.</text><text x="32" y="294" font-size="13" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1.5">IMPATTO POTENZIALE</text><text x="250" y="294" font-size="16" fill="#e2e8f0" font-weight="400" text-anchor="start" >Account con password nota in organizzazioni reali. Non sovrascrive account esistenti (update vuoto).</text><text x="32" y="338" font-size="13" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1.5">INTERVENTO</text><text x="250" y="338" font-size="16" fill="#e2e8f0" font-weight="400" text-anchor="start" >Togliere la route dalla build di produzione; cambiare le password degli eventuali account demo.</text><text x="32" y="382" font-size="13" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1.5">LIMITI</text><text x="250" y="382" font-size="16" fill="#e2e8f0" font-weight="400" text-anchor="start" >Non verificato se la build di produzione contenga la route né se le organizzazioni esistano.</text><text x="1068" y="446" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="end" letter-spacing="1.5">caso reale · anonimizzato</text></svg>
